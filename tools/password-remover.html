<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Unlocker · Remove password from PDF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: #ffffff;
            max-width: 540px;
            width: 100%;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 20, 40, 0.25), 0 8px 20px -8px rgba(0, 32, 64, 0.15);
            padding: 2.25rem 2rem 2rem;
            transition: transform 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b4b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }

        h1 span {
            font-size: 2rem;
        }

        .subhead {
            color: #4a5f73;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2e7daf;
            padding-left: 0.9rem;
            line-height: 1.5;
        }

        .file-zone {
            border: 2px dashed #b9d0e3;
            background: #f9fcff;
            border-radius: 1.4rem;
            padding: 1.8rem 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 1.6rem;
        }

        .file-zone:hover {
            background: #eef7ff;
            border-color: #2e7daf;
        }

        .file-zone.has-file {
            border: 2px solid #2e7daf;
            background: #e3f0fc;
        }

        .file-icon {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            display: block;
        }

        .file-label {
            font-weight: 600;
            color: #0b2b4b;
            word-break: break-word;
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }

        .file-hint {
            font-size: 0.8rem;
            color: #5b6f82;
        }

        .hidden-input {
            display: none;
        }

        .password-area {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #386688;
            margin-bottom: 0.5rem;
        }

        .pw-wrapper {
            display: flex;
            align-items: center;
            background: #f2f7fd;
            border-radius: 3rem;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            border: 1.5px solid #d6e2ef;
            transition: border 0.15s;
        }

        .pw-wrapper:focus-within {
            border-color: #2e7daf;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(46, 125, 175, 0.2);
        }

        .pw-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.85rem 0.2rem 0.85rem 0;
            font-size: 1rem;
            outline: none;
            color: #122b3e;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .pw-wrapper input::placeholder {
            color: #9aafc2;
            font-weight: 400;
        }

        .toggle-pw {
            background: transparent;
            border: none;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
            border-radius: 3rem;
            color: #5b7992;
            transition: background 0.15s;
            line-height: 1;
        }

        .toggle-pw:hover {
            background: #d9e8f5;
            color: #1b4b6c;
        }

        .action-btn {
            width: 100%;
            background: #0b2b4b;
            color: white;
            border: none;
            padding: 1rem 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 8px 18px -6px rgba(11, 43, 75, 0.4);
            margin-bottom: 1rem;
        }

        .action-btn:hover:not(:disabled) {
            background: #1b4b6c;
            box-shadow: 0 12px 22px -8px rgba(11, 43, 75, 0.5);
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
            background: #7a95ab;
        }

        .status {
            font-size: 0.9rem;
            padding: 0.85rem 1rem;
            border-radius: 1rem;
            background: #f0f5fa;
            color: #1e3b52;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            word-break: break-word;
            transition: background 0.2s;
            border-left: 4px solid #b9d0e3;
            margin-top: 1rem;
        }

        .status.error {
            background: #fee9e7;
            border-left-color: #c73b2b;
            color: #a12d1f;
        }

        .status.success {
            background: #e2f3e6;
            border-left-color: #1f8b4c;
            color: #0d5c2e;
        }

        .status.loading {
            background: #e9f0fa;
            border-left-color: #2e7daf;
            color: #1b4b6c;
        }

        .status-icon {
            font-size: 1.2rem;
        }

        .download-link {
            background: #1f8b4c;
            color: white;
            text-decoration: none;
            padding: 0.85rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s;
            margin-top: 0.8rem;
            width: 100%;
            box-shadow: 0 6px 14px -6px rgba(31, 139, 76, 0.4);
        }

        .download-link:hover {
            background: #15703c;
        }

        .footer-note {
            text-align: center;
            font-size: 0.72rem;
            color: #8399ad;
            margin-top: 1.8rem;
            border-top: 1px solid #d9e5f0;
            padding-top: 1.2rem;
        }

        .hidden {
            display: none !important;
        }

        .mt-1 {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span>🔓</span> PDF Unlocker
        </h1>
        <div class="subhead">
            Upload your protected PDF, enter the password, and download an unlocked copy.
        </div>

        <!-- File upload zone -->
        <div class="file-zone" id="fileZone">
            <span class="file-icon" id="fileIcon">📄</span>
            <div class="file-label" id="fileName">Click or drop a PDF file</div>
            <div class="file-hint" id="fileHint">Only .pdf files • password required</div>
            <input type="file" id="pdfInput" class="hidden-input" accept=".pdf,application/pdf">
        </div>

        <!-- Password field -->
        <div class="password-area">
            <label for="passwordInput">PDF password</label>
            <div class="pw-wrapper">
                <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
                <button type="button" class="toggle-pw" id="togglePwBtn" aria-label="Show password">👁️</button>
            </div>
        </div>

        <!-- Action button -->
        <button class="action-btn" id="unlockBtn" disabled>
            <span>🔓</span> Unlock PDF
        </button>

        <!-- Status / feedback area -->
        <div id="statusArea" class="status hidden">
            <span class="status-icon" id="statusIcon">ℹ️</span>
            <span id="statusMessage">Waiting for file and password…</span>
        </div>

        <!-- Download link appears here -->
        <div id="downloadContainer" class="hidden">
            <a id="downloadLink" class="download-link" href="#" download="unlocked.pdf">
                <span>⬇️</span> Download unlocked PDF
            </a>
        </div>

        <div class="footer-note">
            ⚡ Processed locally in your browser — no upload to any server.
        </div>
    </div>

    <!-- Include PDF-lib for PDF manipulation -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        (function() {
            // DOM elements
            const fileZone = document.getElementById('fileZone');
            const fileIcon = document.getElementById('fileIcon');
            const fileName = document.getElementById('fileName');
            const fileHint = document.getElementById('fileHint');
            const pdfInput = document.getElementById('pdfInput');
            const passwordInput = document.getElementById('passwordInput');
            const togglePwBtn = document.getElementById('togglePwBtn');
            const unlockBtn = document.getElementById('unlockBtn');
            const statusArea = document.getElementById('statusArea');
            const statusIcon = document.getElementById('statusIcon');
            const statusMessage = document.getElementById('statusMessage');
            const downloadContainer = document.getElementById('downloadContainer');
            const downloadLink = document.getElementById('downloadLink');

            // State
            let currentFile = null;           // File object
            let currentFilePassword = '';     // string (password from input at unlock time)
            let isProcessing = false;

            // Helper: show status message with type (info, error, success, loading)
            function setStatus(type, message, iconOverride = null) {
                statusArea.classList.remove('hidden', 'error', 'success', 'loading');
                if (type === 'error') {
                    statusArea.classList.add('error');
                    statusIcon.textContent = iconOverride || '❌';
                } else if (type === 'success') {
                    statusArea.classList.add('success');
                    statusIcon.textContent = iconOverride || '✅';
                } else if (type === 'loading') {
                    statusArea.classList.add('loading');
                    statusIcon.textContent = iconOverride || '⏳';
                } else {
                    // info
                    statusIcon.textContent = iconOverride || 'ℹ️';
                }
                statusMessage.textContent = message;
                statusArea.classList.remove('hidden');
            }

            // Hide status completely
            function hideStatus() {
                statusArea.classList.add('hidden');
            }

            // Reset download link & container
            function resetDownload() {
                downloadContainer.classList.add('hidden');
                if (downloadLink.href) {
                    URL.revokeObjectURL(downloadLink.href);
                    downloadLink.href = '#';
                }
                downloadLink.removeAttribute('download');
            }

            // Update unlock button state
            function updateUnlockButton() {
                const hasFile = !!currentFile;
                const hasPassword = passwordInput.value.trim().length > 0;
                // We allow enabling even if password is empty? Some PDFs have empty password? 
                // But requirement: user enters password. We enable only if file and password field has some text,
                // but also if user explicitly wants empty password? We'll allow empty only if we warn? 
                // Better: enable only if file and password length > 0, but also allow empty if they want? 
                // Let's keep it strict: require non-empty password to encourage correct behavior.
                // (If user has empty password PDFs are rare; but we can still allow empty by adjusting)
                // For flexibility: enable when file and password field is not empty OR if we add a checkbox? 
                // We'll enable when file and password length > 0 to avoid accidental empty submit.
                // But we also allow password to be empty if user wants; to be safe, we enable if file exists and the password field is touched? 
                // Better UX: enable only if file AND password field has at least 1 character.
                // That covers 99% of password-protected PDFs.
                const enabled = hasFile && hasPassword && !isProcessing;
                unlockBtn.disabled = !enabled;
            }

            // Update file display + reset other things when new file selected
            function setFile(file) {
                if (!file) {
                    currentFile = null;
                    fileIcon.textContent = '📄';
                    fileName.textContent = 'Click or drop a PDF file';
                    fileHint.textContent = 'Only .pdf files • password required';
                    fileZone.classList.remove('has-file');
                    resetDownload();
                    hideStatus();
                    updateUnlockButton();
                    return;
                }

                // Validate it's a PDF (by type or extension)
                const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                if (!isPdf) {
                    setStatus('error', 'Please select a PDF file.', '⚠️');
                    // reset file
                    pdfInput.value = '';
                    currentFile = null;
                    fileIcon.textContent = '📄';
                    fileName.textContent = 'Click or drop a PDF file';
                    fileHint.textContent = 'Only .pdf files • password required';
                    fileZone.classList.remove('has-file');
                    resetDownload();
                    updateUnlockButton();
                    return;
                }

                currentFile = file;
                fileIcon.textContent = '📑';
                fileName.textContent = file.name;
                fileHint.textContent = `${(file.size / 1024).toFixed(1)} KB • PDF document`;
                fileZone.classList.add('has-file');
                resetDownload();
                hideStatus();   // clear old status when new file comes in
                updateUnlockButton();
            }

            // Handle file input change
            pdfInput.addEventListener('change', (e) => {
                const file = e.target.files[0] || null;
                setFile(file);
            });

            // Drag & drop
            fileZone.addEventListener('click', () => pdfInput.click());

            fileZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileZone.style.background = '#e3f0fc';
                fileZone.style.borderColor = '#2e7daf';
            });

            fileZone.addEventListener('dragleave', () => {
                fileZone.style.background = '';
                fileZone.style.borderColor = '';
            });

            fileZone.addEventListener('drop', (e) => {
                e.preventDefault();
                fileZone.style.background = '';
                fileZone.style.borderColor = '';
                const file = e.dataTransfer.files[0] || null;
                if (file) {
                    // Manually set file input (for consistency)
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    pdfInput.files = dataTransfer.files;
                    setFile(file);
                }
            });

            // Toggle password visibility
            togglePwBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePwBtn.textContent = type === 'password' ? '👁️' : '🙈';
            });

            // Password input changes -> update button state
            passwordInput.addEventListener('input', () => {
                updateUnlockButton();
                // If there was an error about wrong password, we don't auto-clear but hide success/download?
                // Keep it simple: if user edits password after a successful unlock, we can clear download.
                // Because the old download corresponds to previous password.
                resetDownload();
                if (statusArea.classList.contains('success')) {
                    hideStatus();
                }
            });

            // Helper: trigger download of a blob
            function createDownloadLink(blob, filename = 'unlocked.pdf') {
                // revoke old url
                if (downloadLink.href && downloadLink.href.startsWith('blob:')) {
                    URL.revokeObjectURL(downloadLink.href);
                }
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.download = filename;
                downloadContainer.classList.remove('hidden');
            }

            // MAIN UNLOCK FUNCTION
            async function unlockPdf() {
                if (!currentFile) {
                    setStatus('error', 'No PDF file selected.', '📄');
                    return;
                }
                const password = passwordInput.value;  // may be empty, but we'll warn/handle

                if (password.trim() === '') {
                    setStatus('error', 'Please enter the PDF password.', '🔑');
                    return;
                }

                // Disable UI during processing
                isProcessing = true;
                unlockBtn.disabled = true;
                resetDownload();
                setStatus('loading', 'Unlocking PDF… please wait', '⏳');

                try {
                    // Read file as ArrayBuffer
                    const arrayBuffer = await currentFile.arrayBuffer();

                    // Load PDF with pdf-lib
                    const { PDFDocument } = PDFLib;
                    // We need to decrypt using the password. pdf-lib uses 'ignoreEncryption' or password?
                    // Actually pdf-lib does not natively support decryption with password? Wait: 
                    // pdf-lib supports loading encrypted PDFs if you provide a password? 
                    // Checking: PDFDocument.load(buffer, { password: '...' }) – yes, pdf-lib supports password.
                    // However there's a catch: pdf-lib uses a pure JS implementation that may not support all encryption types.
                    // But we'll try.
                    let pdfDoc;
                    try {
                        pdfDoc = await PDFDocument.load(arrayBuffer, {
                            password: password,
                            // Some PDFs have empty passwords; but we already require non-empty.
                            // ignoreEncryption: false (default) – throws if wrong password
                        });
                    } catch (loadError) {
                        console.error('PDF load error:', loadError);
                        // Check if it's a password error or something else
                        const errMsg = loadError.message || '';
                        if (errMsg.toLowerCase().includes('password') || errMsg.toLowerCase().includes('encrypted') || errMsg.toLowerCase().includes('decrypt')) {
                            throw new Error('Incorrect password or unsupported encryption.');
                        } else {
                            throw new Error('Failed to read PDF. The file may be corrupted or uses unsupported encryption.');
                        }
                    }

                    // If we got here, PDF was loaded successfully (decrypted)
                    // Now save the decrypted PDF (without encryption)
                    const decryptedBytes = await pdfDoc.save();
                    const blob = new Blob([decryptedBytes], { type: 'application/pdf' });

                    // Create download link
                    const baseName = currentFile.name.replace(/\.pdf$/i, '') || 'document';
                    createDownloadLink(blob, `${baseName}_unlocked.pdf`);

                    // Show success
                    setStatus('success', 'PDF unlocked successfully! Click the download button below.', '🎉');
                } catch (error) {
                    console.error('Unlock error:', error);
                    let userMsg = error.message || 'Could not unlock the PDF.';
                    if (userMsg.toLowerCase().includes('password') || userMsg.toLowerCase().includes('decrypt')) {
                        userMsg = 'Wrong password or encrypted with unsupported method.';
                    } else if (userMsg.includes('Failed to read')) {
                        userMsg = 'Could not read PDF. It may be corrupted or use unsupported encryption.';
                    } else {
                        userMsg = 'Unlock failed: ' + userMsg;
                    }
                    setStatus('error', userMsg, '❌');
                } finally {
                    isProcessing = false;
                    updateUnlockButton();
                }
            }

            // Attach unlock button click
            unlockBtn.addEventListener('click', unlockPdf);

            // Also allow pressing Enter in password field to trigger unlock (if enabled)
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !unlockBtn.disabled) {
                    e.preventDefault();
                    unlockPdf();
                }
            });

            // Initialize button state
            updateUnlockButton();

            // Cleanup blob URLs on page unload
            window.addEventListener('beforeunload', () => {
                if (downloadLink.href && downloadLink.href.startsWith('blob:')) {
                    URL.revokeObjectURL(downloadLink.href);
                }
            });

            // When file is removed (via resetting input), handle it
            // Not needed but we can keep an eye.
            // If user selects new file via input, setFile already handles.
        })();
    </script>
</body>
</html>
