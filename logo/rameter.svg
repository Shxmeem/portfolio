<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>

  <!-- Circuit lines -->
  <g stroke="#22D3EE" stroke-width="3" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M 70 150 H 110 V 200"/>
    <path d="M 442 360 H 402 V 310"/>
    <path d="M 70 360 H 110 V 320"/>
  </g>
  <circle cx="70" cy="150" r="6" fill="#22D3EE"/>
  <circle cx="442" cy="360" r="6" fill="#22D3EE"/>
  <circle cx="70" cy="360" r="6" fill="#22D3EE"/>

  <!-- R Letter -->
  <text x="256" y="300" font-family="Inter, Arial, sans-serif" font-size="190" font-weight="800" fill="white" text-anchor="middle">R</text>

  <!-- Code brackets + Download -->
  <g stroke="url(#accent)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 165 350 L 125 390 L 165 430"/>
    <path d="M 347 350 L 387 390 L 347 430"/>
    <path d="M 256 350 L 256 430"/>
    <path d="M 226 400 L 256 430 L 286 400"/>
  </g>

  <!-- AI Dot -->
  <circle cx="368" cy="160" r="14" fill="#22D3EE"/>
</svg>
