<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="archGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072254"/>
      <stop offset="40%" stop-color="#0D6EFD"/>
      <stop offset="75%" stop-color="#38E8FF"/>
      <stop offset="100%" stop-color="#8DF8FF"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081C45"/>
      <stop offset="35%" stop-color="#1E88E5"/>
      <stop offset="65%" stop-color="#7B42F6"/>
      <stop offset="100%" stop-color="#5CE1E6"/>
    </linearGradient>

    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2E6E"/>
      <stop offset="50%" stop-color="#6C47FF"/>
      <stop offset="100%" stop-color="#7AF7FF"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38E8FF"/>
      <stop offset="75%" stop-color="#0D6EFD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D6EFD" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#F9FAFC"/>

  <g transform="translate(275, 55) scale(1.1)">
    <!-- Glowing Node / Dot -->
    <circle cx="38" cy="112" r="22" fill="url(#dotGlow)"/>
    <circle cx="38" cy="112" r="9" fill="#0B5ED7"/>
    <circle cx="38" cy="112" r="5" fill="#8DF8FF" filter="url(#glow)"/>

    <!-- Upper 'R' Arch -->
    <path d="M 35 102 
             C 32 52, 72 28, 118 28 
             C 158 28, 182 54, 174 88 
             C 168 112, 146 126, 128 134
             C 138 116, 144 96, 140 78
             C 135 58, 114 48, 92 50
             C 66 52, 48 74, 41 102 Z" 
          fill="url(#archGrad)"/>

    <!-- Highlight bevel on Upper Arch -->
    <path d="M 43 92 
             C 48 58, 78 36, 116 36 
             C 146 36, 166 54, 164 78
             C 158 58, 140 44, 114 44
             C 80 44, 54 64, 43 92 Z" 
          fill="#A8FAFF" opacity="0.55"/>

    <!-- Bottom Right 'R' Leg -->
    <path d="M 122 146 
             C 136 164, 152 186, 174 190 
             C 192 193, 206 182, 212 168 
             C 198 174, 184 172, 172 160 
             C 158 146, 148 130, 138 118 Z" 
          fill="url(#legGrad)"/>

    <!-- Zig-Zag Growth Line (Shortened further to sit cleanly inside the R curve) -->
    <!-- To adjust length manually: lower the L 160 104 / L 148 92 coordinates to pull it back further, or raise them to extend -->
    <path d="M 52 168 
             L 94 118 
             L 124 146 
             L 160 104 
             L 148 92 
             L 122 119 
             L 92 91 
             L 36 156 
             C 30 163, 32 174, 39 179 
             C 46 184, 56 182, 62 175 
             L 104 126 
             L 94 118 Z" 
          fill="url(#arrowGrad)"/>

    <!-- Clean Inner Highlight on Zig-Zag Line -->
    <!-- To adjust highlight tip manually: match L 154 99 / L 146 91 slightly inside the outer tip coordinates above -->
    <path d="M 45 170 
             L 93 113 
             L 123 141 
             L 154 99 
             L 146 91 
             L 122 124 
             L 92 96 
             L 40 158 
             C 37 162, 38 168, 45 170 Z" 
          fill="none" stroke="#9DF9FF" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <text x="400" y="362" 
        font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="68" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#082454" 
        text-anchor="middle">RAMETER</text>

  <text x="400" y="398" 
        font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="18.5" 
        font-weight="600" 
        letter-spacing="2.2" 
        fill="#0D2C63" 
        text-anchor="middle">AI ANALYTICS &amp; OPTIMIZATION</text>
</svg>

